# Aria add-on manifest. PREBUILT image — the Supervisor pulls
# ghcr.io/alexfsawaya-dot/aria:<version> for the hub's arch (never builds on-device).
# The image is built off-device by the aria-web repo's GitHub Action. Bump `version`
# in lockstep with the pushed image tag.
name: Aria
version: "0.1.1"
slug: aria
description: The Aria smart-home dashboard — runs alongside Home Assistant and talks to it locally.
url: https://github.com/alexfsawaya-dot/aria-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/alexfsawaya-dot/aria
init: false
boot: auto
startup: application
watchdog: "tcp://[HOST]:[PORT:3000]"
ports:
  "3000/tcp": 3000
ports_description:
  "3000/tcp": Aria web interface
homeassistant_api: true
hassio_api: false
host_network: false
options:
  setup_code: ""
  wifi_ssid: ""
  wifi_password: ""
  ha_url: ""
  ha_token: ""
schema:
  setup_code: "str?"
  wifi_ssid: "str?"
  wifi_password: "password?"
  ha_url: "str?"
  ha_token: "password?"
